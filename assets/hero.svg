<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="0.55" stop-color="#0a1322"/><stop offset="1" stop-color="#08131b"/></linearGradient>
  <radialGradient id="blue" cx="77%" cy="42%" r="48%"><stop offset="0" stop-color="#4f8cff" stop-opacity=".20"/><stop offset="1" stop-color="#4f8cff" stop-opacity="0"/></radialGradient>
  <radialGradient id="mint" cx="89%" cy="70%" r="35%"><stop offset="0" stop-color="#52d6b3" stop-opacity=".14"/><stop offset="1" stop-color="#52d6b3" stop-opacity="0"/></radialGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4B5CFF"/><stop offset="0.52" stop-color="#2C8FFF"/><stop offset="1" stop-color="#48E0D2"/></linearGradient>
  <linearGradient id="brandOrbit" x1="92" y1="396" x2="420" y2="112" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#4B5CFF"/><stop offset="0.48" stop-color="#2C8FFF"/><stop offset="1" stop-color="#48E0D2"/></linearGradient>
  <linearGradient id="brandInner" x1="174" y1="344" x2="354" y2="164" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#4058E8"/><stop offset="0.56" stop-color="#2F9BFF"/><stop offset="1" stop-color="#4EE0D4"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#111d2e"/><stop offset="1" stop-color="#0c1725"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#9fb4d1" opacity=".10"/></pattern>
</defs>
<rect width="1600" height="640" rx="32" fill="url(#bg)"/>
<rect width="1600" height="640" rx="32" fill="url(#dots)"/>
<rect width="1600" height="640" rx="32" fill="url(#blue)"/>
<rect width="1600" height="640" rx="32" fill="url(#mint)"/>
<path d="M785 74 C1010 18 1290 45 1530 185" fill="none" stroke="#4B5CFF" stroke-opacity=".09"/>
<path d="M790 570 C1040 625 1330 575 1530 430" fill="none" stroke="#48E0D2" stroke-opacity=".08"/>

<g transform="translate(88,78)">
  <g transform="translate(-4,-18) scale(.135)">
    <path d="M 132 383 A 178 178 0 1 1 394 139" fill="none" stroke="url(#brandOrbit)" stroke-width="34" stroke-linecap="round"/>
    <circle cx="394" cy="139" r="27" fill="#7DE7E3" stroke="#0B1324" stroke-width="10"/>
    <circle cx="427" cy="259" r="22" fill="#39AAFF" stroke="#0B1324" stroke-width="9"/>
    <circle cx="389" cy="374" r="18" fill="#65D9D5" stroke="#0B1324" stroke-width="8"/>
    <path d="M 220 367 A 116 116 0 1 1 354 334" fill="none" stroke="url(#brandInner)" stroke-width="24" stroke-linecap="round"/>
    <circle cx="256" cy="256" r="13" fill="#F5F8FF"/>
    <path d="M256 256V190" fill="none" stroke="#F5F8FF" stroke-width="18" stroke-linecap="round"/>
    <path d="M256 256L309 291" fill="none" stroke="#F5F8FF" stroke-width="18" stroke-linecap="round"/>
  </g>
  <text x="78" y="16" fill="#f5f8ff" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="760">DSH Computer History</text>
  <text x="79" y="40" fill="#7890ad" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.45">DEEPSEEK HARNESS · LOCAL-FIRST</text>
  <text x="0" y="112" fill="#f5f8ff" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="67" font-weight="760" letter-spacing="-2.8">Remember the work.</text>
  <text x="0" y="184" fill="url(#accent)" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="67" font-weight="760" letter-spacing="-2.8">Not the screen.</text>
  <text x="2" y="238" fill="#c0cbdb" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="500">Turn local metadata into Work Episodes so an agent knows</text>
  <text x="2" y="270" fill="#8c9db2" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="500">what you were doing — and where to continue.</text>
  <g transform="translate(0,318)">
    <g><rect width="128" height="40" rx="12" fill="#101c2b" stroke="#263a50"/><circle cx="18" cy="20" r="4" fill="#48E0D2"/><text x="31" y="26" fill="#d3dfef" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="700">LOCAL-FIRST</text></g>
    <g transform="translate(142,0)"><rect width="151" height="40" rx="12" fill="#101c2b" stroke="#263a50"/><circle cx="18" cy="20" r="4" fill="#75a7ff"/><text x="31" y="26" fill="#d3dfef" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="700">METADATA-ONLY</text></g>
    <g transform="translate(307,0)"><rect width="174" height="40" rx="12" fill="#101c2b" stroke="#263a50"/><circle cx="18" cy="20" r="4" fill="#8b7cff"/><text x="31" y="26" fill="#d3dfef" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="700">RESUME CONTEXT</text></g>
  </g>
  <path d="M0 412 H498" stroke="#243448"/>
  <text x="0" y="448" fill="#667990" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">github.com/ysr666/dsh-computer-history</text>
</g>

<g aria-label="Abstract timeline and work-episode layers">
  <!-- spatial context arcs -->
  <path d="M735 128 C930 50 1230 42 1515 170" fill="none" stroke="#244B8D" stroke-width="1.5" stroke-opacity=".42"/>
  <path d="M718 208 C960 108 1288 120 1540 286" fill="none" stroke="#2C8FFF" stroke-width="1.4" stroke-opacity=".23"/>
  <path d="M705 540 C965 628 1308 600 1530 458" fill="none" stroke="#48E0D2" stroke-width="1.4" stroke-opacity=".16"/>

  <!-- translucent work-episode layers: abstract, not product UI -->
  <g fill="#112039" fill-opacity=".44" stroke="#2D6095" stroke-width="1.4">
    <rect x="875" y="182" width="92" height="256" rx="26"/>
    <rect x="972" y="135" width="112" height="330" rx="30" fill-opacity=".34"/>
    <rect x="1088" y="210" width="82" height="218" rx="24" fill-opacity=".28"/>
    <rect x="1172" y="118" width="132" height="372" rx="32" fill-opacity=".38"/>
    <rect x="1310" y="164" width="144" height="276" rx="30" fill-opacity=".31"/>
  </g>
  <g stroke="#6FA8D8" stroke-opacity=".09" stroke-width="1">
    <path d="M902 227h38M902 245h28M999 194h58M999 214h44M1199 177h78M1199 198h54M1338 222h88M1338 242h64"/>
  </g>

  <!-- timeline axis and activity nodes -->
  <path d="M1280 68 V548" stroke="#3D8CE8" stroke-width="2" stroke-opacity=".64"/>
  <circle cx="1280" cy="104" r="9" fill="#4B5CFF"/>
  <circle cx="1280" cy="160" r="19" fill="#356FFF"/>
  <circle cx="1280" cy="248" r="28" fill="#39BDF2" filter="url(#glow)"/>
  <circle cx="1280" cy="350" r="31" fill="#52D8B8" filter="url(#glow)"/>
  <circle cx="1280" cy="438" r="11" fill="#53D4D0"/>
  <circle cx="1280" cy="500" r="17" fill="#2D82DD"/>
  <circle cx="1280" cy="544" r="9" fill="#1D4C91"/>

  <!-- work-continuity trajectories -->
  <defs>
    <linearGradient id="continuityLine" x1="760" y1="250" x2="1480" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4B5CFF"/>
      <stop offset="0.48" stop-color="#2C8FFF"/>
      <stop offset="1" stop-color="#48E0D2"/>
    </linearGradient>
  </defs>
  <path d="M752 292 C918 224 1060 224 1180 276 C1300 328 1405 360 1500 472" fill="none" stroke="url(#continuityLine)" stroke-width="4" stroke-linecap="round"/>
  <path d="M752 398 C910 454 1075 470 1280 500 C1388 516 1445 508 1500 492" fill="none" stroke="#44B9E7" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 13" stroke-opacity=".85"/>
  <circle cx="768" cy="292" r="5" fill="#3F70EE"/>
  <circle cx="814" cy="407" r="4" fill="#2C8FFF"/>
  <circle cx="867" cy="423" r="5" fill="#326ED0"/>
  <circle cx="918" cy="438" r="4" fill="#4B5CFF"/>
  <circle cx="1398" cy="511" r="5" fill="#2C8FFF"/>
  <circle cx="1442" cy="505" r="4" fill="#4B5CFF"/>
</g>
</svg>
