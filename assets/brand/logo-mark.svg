<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">DSH Computer History logo</title>
  <desc id="desc">A clock surrounded by an open timeline orbit with three activity nodes.</desc>
  <defs>
    <linearGradient id="orbit" x1="92" y1="396" x2="420" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4B5CFF"/>
      <stop offset="0.48" stop-color="#2C8FFF"/>
      <stop offset="1" stop-color="#48E0D2"/>
    </linearGradient>
    <linearGradient id="inner" x1="174" y1="344" x2="354" y2="164" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4058E8"/>
      <stop offset="0.56" stop-color="#2F9BFF"/>
      <stop offset="1" stop-color="#4EE0D4"/>
    </linearGradient>
  </defs>

  <!-- outer timeline orbit -->
  <path d="M 132 383 A 178 178 0 1 1 394 139"
        fill="none" stroke="url(#orbit)" stroke-width="34" stroke-linecap="round"/>

  <!-- activity nodes -->
  <circle cx="394" cy="139" r="27" fill="#7DE7E3" stroke="#0B1324" stroke-width="10"/>
  <circle cx="427" cy="259" r="22" fill="#39AAFF" stroke="#0B1324" stroke-width="9"/>
  <circle cx="389" cy="374" r="18" fill="#65D9D5" stroke="#0B1324" stroke-width="8"/>

  <!-- inner history ring -->
  <path d="M 220 367 A 116 116 0 1 1 354 334"
        fill="none" stroke="url(#inner)" stroke-width="24" stroke-linecap="round"/>

  <!-- clock -->
  <circle cx="256" cy="256" r="13" fill="#F5F8FF"/>
  <path d="M256 256V190" fill="none" stroke="#F5F8FF" stroke-width="18" stroke-linecap="round"/>
  <path d="M256 256L309 291" fill="none" stroke="#F5F8FF" stroke-width="18" stroke-linecap="round"/>
</svg>
