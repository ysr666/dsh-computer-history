name: Feature request
description: Propose an improvement and call out its privacy implications
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should dsh-computer-history do instead?
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy / data impact
      description: Would this collect, store, retain, transmit or expose any new metadata or content? If not, say why not.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
