name: macOS native + package

on:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'bin/**'
      - 'extension-editor/**'
      - 'scripts/build-native.mjs'
      - 'scripts/test-native.mjs'
      - 'scripts/build-extension.mjs'
      - 'presets/**'
      - 'cordis.patch.yml'
      - '.npmignore'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/macos-native.yml'
  schedule:
    - cron: '53 5 1,15 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-native:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm native:build
      - run: pnpm native:test
      - run: pnpm install --frozen-lockfile
        working-directory: extension-editor
      - run: pnpm pack --pack-destination /tmp
      - name: Verify every package.json files entry is present
        run: |
          tarball=$(ls /tmp/dsh-computer-history-*.tgz)
          missing=0
          while IFS= read -r entry; do
            if ! tar -tzf "$tarball" | grep -qE "^package/${entry}(/|$)"; then
              echo "files promises ${entry} and the tarball does not contain it"
              missing=1
            fi
          done < <(node -p "require('./package.json').files.join('\n')")
          exit "$missing"
