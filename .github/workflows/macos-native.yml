name: macOS native

on:
  pull_request:
    paths:
      - 'native/**'
      - 'bin/**'
      - 'extension-editor/**'
      - 'scripts/build-native.mjs'
      - 'scripts/test-native.mjs'
      - 'scripts/build-extension.mjs'
      - 'presets/**'
      - 'cordis.patch.yml'
      - '.npmignore'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/macos-native.yml'
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'bin/**'
      - 'extension-editor/**'
      - 'scripts/build-native.mjs'
      - 'scripts/test-native.mjs'
      - 'scripts/build-extension.mjs'
      - 'presets/**'
      - 'cordis.patch.yml'
      - '.npmignore'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/macos-native.yml'
  schedule:
    - cron: '53 5 1,15 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-native:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm native:build
      - run: pnpm native:test
      # Packaging is intentionally not tested here anymore. The released package contains native
      # artifacts from three different runners; collectors.yml assembles that single tgz and verifies it
      # on all supported platforms. This workflow owns only the macOS native source/build contract.
