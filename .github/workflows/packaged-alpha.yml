name: Packaged alpha matrix

on:
  pull_request:
    paths:
      - '.github/workflows/packaged-alpha.yml'
      - '.github/workflows/release.yml'
      - 'native/**'
      - 'src/host/plugin.ts'
      - 'src/client/**'
      - 'locale/**'
      - 'scripts/build-native.mjs'
      - 'scripts/write-native-manifest.mjs'
      - 'scripts/verify-native-package.mjs'
      - 'scripts/e2e-collector-transport.mjs'
      - 'scripts/e2e-macos.mjs'
      - 'scripts/verify-packaged-client.mjs'
      - 'scripts/e2e-product-journey.mjs'
      - 'scripts/product-journey-*.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/packaged-alpha.yml'
      - '.github/workflows/release.yml'
      - 'native/**'
      - 'src/host/plugin.ts'
      - 'src/client/**'
      - 'locale/**'
      - 'scripts/build-native.mjs'
      - 'scripts/write-native-manifest.mjs'
      - 'scripts/verify-native-package.mjs'
      - 'scripts/e2e-collector-transport.mjs'
      - 'scripts/e2e-macos.mjs'
      - 'scripts/verify-packaged-client.mjs'
      - 'scripts/e2e-product-journey.mjs'
      - 'scripts/product-journey-*.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaged-alpha-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    name: native artifact (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin
            binary: bin/dsh-computer-history-collector
          - os: windows-latest
            platform: win32
            binary: bin/dsh-computer-history-collector-windows.exe
          - os: ubuntu-latest
            platform: linux
            binary: bin/dsh-computer-history-collector-linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0
      - name: Build the native collector on its own platform
        run: node scripts/build-native.mjs
      - name: Record the runner source commit
        env:
          NATIVE_PLATFORM: ${{ matrix.platform }}
        run: node -e "const fs=require('node:fs'); fs.writeFileSync('bin/source-'+process.env.NATIVE_PLATFORM+'.txt', process.env.GITHUB_SHA+'\n')"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.platform }}
          path: |
            ${{ matrix.binary }}
            bin/source-${{ matrix.platform }}.txt
          if-no-files-found: error
          retention-days: 3

  assemble:
    name: assemble one three-platform tarball
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
        working-directory: extension-editor
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-darwin
          path: bin
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-win32
          path: bin
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-linux
          path: bin
      - name: Prove all native jobs came from this commit
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          for (const platform of ['darwin', 'win32', 'linux']) {
            const file = 'bin/source-' + platform + '.txt'
            const actual = fs.readFileSync(file, 'utf8').trim()
            if (actual !== process.env.GITHUB_SHA) {
              throw new Error(platform + ' artifact came from ' + actual + ', expected ' + process.env.GITHUB_SHA)
            }
            fs.rmSync(file)
          }
          fs.chmodSync('bin/dsh-computer-history-collector', 0o755)
          fs.chmodSync('bin/dsh-computer-history-collector-linux', 0o755)
          NODE
      - name: Record native hashes and provenance
        run: pnpm native:manifest
      - name: Pack without rebuilding native artifacts
        env:
          DSH_NATIVE_PREBUILT: '1'
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          pnpm pack --pack-destination "$RUNNER_TEMP/package"
      - name: Verify the assembled native package
        run: |
          tarball=$(ls "$RUNNER_TEMP"/package/dsh-computer-history-*.tgz | head -1)
          DSH_RELEASE_TARBALL="$tarball" node scripts/verify-native-package.mjs

      - name: Dry-run release manifest and changelog on a non-dev candidate
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$version" != *-dev* ]]; then
            tarball=$(ls "$RUNNER_TEMP"/package/dsh-computer-history-*.tgz | head -1)
            DSH_RELEASE_TARBALL="$tarball" pnpm verify:release
          else
            echo "Development version: release-cut preflight deferred until a non-dev candidate"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: three-platform-plugin
          path: ${{ runner.temp }}/package/dsh-computer-history-*.tgz
          if-no-files-found: error
          retention-days: 3

  install:
    name: clean install + packaged product (${{ matrix.os }})
    needs: assemble
    runs-on: ${{ matrix.os }}
    # Includes the 55-check macOS journey. A runner-specific browser/consent
    # failure must block the PR instead of being discovered only at release.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: three-platform-plugin
          path: ${{ runner.temp }}/package
      - name: Install the supported DSH CLI in an isolated tool directory
        run: npm install --prefix "${{ runner.temp }}/dsh-cli" @deepseek-ai/dsh@0.2.0-rc.2
      - name: Put the isolated DSH CLI on PATH
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_PATH, require('node:path').join(process.env.RUNNER_TEMP,'dsh-cli','node_modules','.bin')+'\n')"
      - name: Locate the exact assembled tarball
        run: node -e "const fs=require('node:fs'),p=require('node:path'); const d=p.join(process.env.RUNNER_TEMP,'package'); const f=fs.readdirSync(d).find(x=>x.endsWith('.tgz')); if(!f) throw new Error('tarball missing'); fs.appendFileSync(process.env.GITHUB_ENV,'DSH_E2E_TARBALL='+p.join(d,f)+'\n')"
      - name: Verify packaged hashes on this platform
        run: node scripts/verify-native-package.mjs
      - name: Strict packaged product path, no executable override or checkout wiring
        env:
          DSH_E2E_VERIFY_CLIENT: '1'
          DSH_E2E_TRANSPORT_TIMEOUT_MS: '480000'
        run: pnpm e2e:collector-transport
      # The release job previously ran the full installed-browser journey only
      # after manual authorization. Run that exact fixture on macOS PR checks
      # against the assembled tarball to catch Runner inventory/CDP drift before
      # the release cut. The three-OS strict installed-client gate above stays.
      - name: Install full journey test dependencies on macOS
        if: matrix.os == 'macos-14'
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir extension-editor install --frozen-lockfile
          pnpm build:editor-extension
          pnpm build:extension
      - name: Full installed-product journey on macOS release candidate
        if: matrix.os == 'macos-14'
        env:
          PANEL_CHROME: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
        run: |
          set -euo pipefail
          test -x "$PANEL_CHROME"
          tarball=$(ls "$RUNNER_TEMP"/package/dsh-computer-history-*.tgz | head -1)
          test -f "$tarball"
          DSH_PRODUCT_TARBALL="$tarball" \
            DSH_CLI="$RUNNER_TEMP/dsh-cli/node_modules/.bin/dsh" \
            pnpm e2e:product-journey

      - name: Upload packaged-install product evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaged-product-${{ matrix.os }}
          path: |
            .debug/e2e-macos/**/checks.json
            .debug/e2e-macos/**/packaged-client/evidence.json
            .debug/e2e-macos/**/packaged-client/first-run.png
            .debug/e2e-macos/**/packaged-client/settings.png
            .debug/e2e-macos/**/packaged-client/first-run.txt
            .debug/e2e-macos/**/packaged-client/settings.txt
          if-no-files-found: error
          retention-days: 7

  # Unlike the stable three-platform gate above, this is a prerelease Host
  # compatibility check. Run it on PRs only and do not infer Windows/Linux
  # Alpha 2 Desktop coverage from a macOS installed-browser journey.
  alpha2_compat:
    name: installed DSH 0.2.1-alpha.2 compatibility (macos-14)
    if: github.event_name == 'pull_request'
    needs: assemble
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0
          cache: pnpm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: three-platform-plugin
          path: ${{ runner.temp }}/package
      - name: Install isolated Alpha 2 CLI and browser/editor test dependencies
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dsh-alpha2-cli"
          echo '{"private":true}' > "$RUNNER_TEMP/dsh-alpha2-cli/package.json"
          npm install --prefix "$RUNNER_TEMP/dsh-alpha2-cli" --no-audit --no-fund \
            --registry=https://registry.npmjs.org @deepseek-ai/dsh@0.2.1-alpha.2
          "$RUNNER_TEMP/dsh-alpha2-cli/node_modules/.bin/dsh" --version | grep -Fx '0.2.1-alpha.2'
          pnpm install --frozen-lockfile
          pnpm --dir extension-editor install --frozen-lockfile
          pnpm build:editor-extension
          pnpm build:extension
      - name: Real Chrome + DCH lifecycle against isolated Alpha 2 Host
        env:
          PANEL_CHROME: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
          DSH_WEB_APP_SPEC: '@deepseek-ai/dsh-web-app@0.2.1-alpha.2'
          DSH_E2E_REGISTRY: https://registry.npmjs.org/
          DSH_E2E_ALLOW_KOFFI: '1'
        run: |
          set -euo pipefail
          test -x "$PANEL_CHROME"
          tarball=$(ls "$RUNNER_TEMP"/package/dsh-computer-history-*.tgz | head -1)
          test -f "$tarball"
          DSH_PRODUCT_TARBALL="$tarball" \
            DSH_CLI="$RUNNER_TEMP/dsh-alpha2-cli/node_modules/.bin/dsh" \
            pnpm e2e:product-journey
      - name: Preserve test results only, never Host/pairing secrets
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alpha2-installed-product-checks
          path: .debug/e2e-product-journey/**/checks.json
          if-no-files-found: warn
          retention-days: 3
