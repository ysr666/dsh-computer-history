# Cross-platform collector contract.
#
# Relevant collector/host changes run the protocol layer on Linux, macOS and Windows before merge
# and again on main. These are standard GitHub-hosted runners in a public repository, so keeping the
# three-platform contract visible is more valuable than reducing the matrix to one OS.
#
# This workflow does not by itself prove live UI Automation / AT-SPI desktop observation. Real-machine
# evidence and remaining platform limitations live in docs/validation-three-platforms.md.
# unverified-platforms: none
name: collectors

on:
  pull_request:
    paths:
      - 'native/**'
      - 'src/host/**'
      - 'src/shared/**'
      - 'tests/conformance/**'
      - 'scripts/*collector*.mjs'
      - 'scripts/*native*.mjs'
      - 'scripts/verify-ci-boundaries.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/collectors.yml'
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'src/host/**'
      - 'src/shared/**'
      - 'tests/conformance/**'
      - 'scripts/*collector*.mjs'
      - 'scripts/*native*.mjs'
      - 'scripts/verify-ci-boundaries.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/collectors.yml'
  schedule:
    - cron: '23 5 1,15 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  protocol:
    name: protocol layer on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: The message layer, on this platform
        run: |
          cargo test --manifest-path native/collector-protocol/Cargo.toml
          cargo test --manifest-path native/windows/Cargo.toml
          cargo test --manifest-path native/linux/Cargo.toml

  # A periodic/manual second-OS Node compatibility sweep. Normal Node 22/24 compatibility is already
  # covered by CI on Ubuntu; this catches host assumptions that only show up on macOS.
  suite:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: conformance + Node 22 compatibility on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: The gate, which includes tests/conformance
        run: pnpm verify

  native-package:
    if: github.event_name != 'schedule'
    name: build packaged collector on ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin
            binary: bin/dsh-computer-history-collector
            metadata: bin/native-artifact-darwin.json
          - os: windows-latest
            platform: win32
            binary: bin/dsh-computer-history-collector-windows.exe
            metadata: bin/native-artifact-win32.json
          - os: ubuntu-latest
            platform: linux
            binary: bin/dsh-computer-history-collector-linux
            metadata: bin/native-artifact-linux.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0
      - name: Build native collector on its target OS
        run: node scripts/build-native.mjs
      - name: Record runner-side SHA-256 provenance
        run: node scripts/write-native-artifact-metadata.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ matrix.platform }}
          path: |
            ${{ matrix.binary }}
            ${{ matrix.metadata }}
          if-no-files-found: error
          retention-days: 3

  assemble-package:
    if: github.event_name != 'schedule'
    name: assemble one three-platform package
    needs: native-package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
        working-directory: extension-editor
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-darwin
          path: bin
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-win32
          path: bin
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-linux
          path: bin
      - name: Verify runner artifacts and write combined provenance
        run: node scripts/assemble-native-artifacts.mjs
      - name: Pack without rebuilding staged native artifacts
        run: |
          mkdir -p package-out
          DSH_NATIVE_PREBUILT=1 pnpm pack --pack-destination package-out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: three-platform-package
          path: package-out/*.tgz
          if-no-files-found: error
          retention-days: 3

  packaged-install:
    if: github.event_name != 'schedule'
    name: packaged collector handshake on ${{ matrix.os }}
    needs: assemble-package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: three-platform-package
          path: package-out
      - name: Install supported DSH CLI
        run: |
          node -e "const cp=require('node:child_process'),fs=require('node:fs'),os=require('node:os'),path=require('node:path'); const root=path.join(process.env.RUNNER_TEMP,'dsh-cli'); const npm=process.platform==='win32'?'npm.cmd':'npm'; cp.execFileSync(npm,['install','--prefix',root,'@deepseek-ai/dsh@0.2.0-rc.2'],{stdio:'inherit'}); fs.appendFileSync(process.env.GITHUB_PATH,path.join(root,'node_modules','.bin')+os.EOL)"
      - name: Locate the exact assembled package
        run: |
          node -e "const fs=require('node:fs'),os=require('node:os'),path=require('node:path'); const dir='package-out'; const name=fs.readdirSync(dir).find(x=>x.endsWith('.tgz')); if(!name) process.exit(2); fs.appendFileSync(process.env.GITHUB_ENV,'DSH_RELEASE_TARBALL='+path.resolve(dir,name)+os.EOL)"
      - name: Strict transport through the packaged platform collector
        env:
          DSH_E2E_REQUIRE_PACKAGED_COLLECTOR: '1'
        run: pnpm e2e:collector-transport

