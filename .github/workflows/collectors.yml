# Cross-platform collector contract.
#
# Pull requests run the Linux protocol gate only, and only when collector/host-facing files change.
# A merge to main runs the protocol layer on Linux/macOS/Windows for those same relevant changes.
# The expensive macOS conformance/full-verification suite runs only on manual dispatch and on the
# twice-monthly safety sweep. That keeps the cross-platform contract without charging every UI/docs merge.
#
# NOT verified here - observation through UI Automation or AT-SPI. Those need a desktop session with a
# window to look at, not a runner, so the live rows stay marked unverified in
# tests/conformance/fixtures/adapters.json and docs/validation-three-platforms.md until a machine with a
# desktop produces them. A green run here is not evidence for those rows.
#
# A platform whose live row does not exist yet is listed here and in the fixture and the
# validation file; scripts/verify-ci-boundaries.mjs fails when the three disagree.
# unverified-platforms: none
name: collectors

on:
  pull_request:
    paths:
      - 'native/**'
      - 'src/host/**'
      - 'src/shared/**'
      - 'tests/conformance/**'
      - 'scripts/*collector*.mjs'
      - 'scripts/*native*.mjs'
      - 'scripts/verify-ci-boundaries.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/collectors.yml'
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'src/host/**'
      - 'src/shared/**'
      - 'tests/conformance/**'
      - 'scripts/*collector*.mjs'
      - 'scripts/*native*.mjs'
      - 'scripts/verify-ci-boundaries.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/collectors.yml'
  # Safety sweep: Node 22 full verification plus all three protocol runners twice a month.
  schedule:
    - cron: '23 5 1,15 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  protocol-pr:
    if: github.event_name == 'pull_request'
    name: protocol layer on ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The message layer, on Linux PR gate
        run: |
          cargo test --manifest-path native/collector-protocol/Cargo.toml
          cargo test --manifest-path native/windows/Cargo.toml
          cargo test --manifest-path native/linux/Cargo.toml

  protocol-full:
    if: github.event_name != 'pull_request'
    name: protocol layer on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - name: The message layer, on this platform
        run: |
          cargo test --manifest-path native/collector-protocol/Cargo.toml
          cargo test --manifest-path native/windows/Cargo.toml
          cargo test --manifest-path native/linux/Cargo.toml

  # The core PR gate already runs the whole TypeScript verification suite on Node 24.
  # Keep the expensive macOS duplicate as a periodic/manual compatibility sweep on Node 22.
  suite:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: conformance + Node 22 compatibility on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: The gate, which includes tests/conformance
        run: pnpm verify
