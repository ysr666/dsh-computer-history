# Cross-platform collector contract.
#
# Relevant collector/host changes run the protocol layer on Linux, macOS and Windows before merge
# and again on main. These are standard GitHub-hosted runners in a public repository, so keeping the
# three-platform contract visible is more valuable than reducing the matrix to one OS.
#
# This workflow does not by itself prove live UI Automation / AT-SPI desktop observation. Real-machine
# evidence and remaining platform limitations live in docs/validation-three-platforms.md.
# unverified-platforms: none
name: collectors

on:
  pull_request:
    paths:
      - 'native/**'
      - 'src/host/**'
      - 'src/shared/**'
      - 'tests/conformance/**'
      - 'scripts/*collector*.mjs'
      - 'scripts/*native*.mjs'
      - 'scripts/e2e-assembled-package.mjs'
      - 'scripts/e2e-packaged-transport.mjs'
      - 'scripts/verify-ci-boundaries.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/collectors.yml'
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'src/host/**'
      - 'src/shared/**'
      - 'tests/conformance/**'
      - 'scripts/*collector*.mjs'
      - 'scripts/*native*.mjs'
      - 'scripts/e2e-assembled-package.mjs'
      - 'scripts/e2e-packaged-transport.mjs'
      - 'scripts/verify-ci-boundaries.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/collectors.yml'
  schedule:
    - cron: '23 5 1,15 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  protocol:
    name: protocol layer on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: The message layer, on this platform
        run: |
          cargo test --manifest-path native/collector-protocol/Cargo.toml
          cargo test --manifest-path native/windows/Cargo.toml
          cargo test --manifest-path native/linux/Cargo.toml

  # A periodic/manual second-OS Node compatibility sweep. Normal Node 22/24 compatibility is already
  # covered by CI on Ubuntu; this catches host assumptions that only show up on macOS.
  suite:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: conformance + Node 22 compatibility on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The gate, which includes build and tests/conformance
        run: pnpm verify

  packaged-native:
    name: packaged native collector on ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin
            os: macos-15
            artifact: native-darwin
            binary: bin/dsh-computer-history-collector
          - platform: win32
            os: windows-latest
            artifact: native-win32
            binary: bin/dsh-computer-history-collector-windows.exe
          - platform: linux
            os: ubuntu-latest
            artifact: native-linux
            binary: bin/dsh-computer-history-collector-linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0
      - name: Build the collector on its native runner
        run: node scripts/build-native.mjs
      - name: Verify the expected package path exists
        env:
          EXPECTED_NATIVE_BINARY: ${{ matrix.binary }}
        run: node -e "const fs=require('node:fs');const p=process.env.EXPECTED_NATIVE_BINARY;if(!fs.existsSync(p)){throw new Error('missing '+p)};console.log(p,fs.statSync(p).size+' bytes')"
      - uses: actions/upload-artifact@c2acdedd35a8824a1552c7137f8c18288c3ea469 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  assembled-native-package:
    name: assemble one tarball with all three native collectors
    needs: packaged-native
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
        working-directory: extension-editor
      - uses: actions/download-artifact@0d2ec9d4cbcefe257d822f108de2a1f15f8da9f6 # v7.0.0
        with:
          name: native-darwin
          path: bin
      - uses: actions/download-artifact@0d2ec9d4cbcefe257d822f108de2a1f15f8da9f6 # v7.0.0
        with:
          name: native-win32
          path: bin
      - uses: actions/download-artifact@0d2ec9d4cbcefe257d822f108de2a1f15f8da9f6 # v7.0.0
        with:
          name: native-linux
          path: bin
      - name: Restore executable modes
        run: chmod +x bin/dsh-computer-history-collector bin/dsh-computer-history-collector-linux
      - name: Pack the exact assembled plugin
        env:
          DSH_NATIVE_PREBUILT: '1'
        run: pnpm pack --pack-destination /tmp
      - name: Verify all native collectors and hashes are in the tarball
        run: |
          tarball=$(ls /tmp/dsh-computer-history-*.tgz | head -1)
          DSH_RELEASE_TARBALL="$tarball" node scripts/verify-native-package.mjs
      - uses: actions/upload-artifact@c2acdedd35a8824a1552c7137f8c18288c3ea469 # v7.0.2
        with:
          name: assembled-plugin
          path: /tmp/dsh-computer-history-*.tgz
          if-no-files-found: error

  assembled-install:
    name: install assembled tarball on ${{ matrix.os }}
    needs: assembled-native-package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0
      - uses: actions/download-artifact@0d2ec9d4cbcefe257d822f108de2a1f15f8da9f6 # v7.0.0
        with:
          name: assembled-plugin
          path: ${{ runner.temp }}/assembled-plugin
      - name: Install DSH 0.2.0-rc.2 CLI
        if: runner.os != 'Windows'
        run: |
          npm install --prefix "$RUNNER_TEMP/dsh-cli" @deepseek-ai/dsh@0.2.0-rc.2
          echo "$RUNNER_TEMP/dsh-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Install DSH 0.2.0-rc.2 CLI on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm install --prefix "$env:RUNNER_TEMP\dsh-cli" @deepseek-ai/dsh@0.2.0-rc.2
          "$env:RUNNER_TEMP\dsh-cli\node_modules\.bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Clean-install the exact assembled plugin with no collector override
        env:
          DSH_E2E_PACKAGE_DIR: ${{ runner.temp }}/assembled-plugin
        run: node scripts/e2e-assembled-package.mjs
      - name: Run strict Host transport against the exact packaged collector
        env:
          DSH_E2E_PACKAGE_DIR: ${{ runner.temp }}/assembled-plugin
        run: node scripts/e2e-packaged-transport.mjs

