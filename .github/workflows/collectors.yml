# The conformance suite, on the three platforms it is a contract for.
#
# PRs run the Linux protocol gate only. Full three-platform protocol coverage plus the macOS
# conformance suite runs after merge to main (and on manual dispatch). This preserves the
# cross-platform contract while avoiding expensive macOS/Windows runners on every PR push.
#
# What this verifies and what it does not, because the difference is the whole point of the file:
#
#   verified on main/manual - the message layer on every platform (cargo test on windows-latest,
#   ubuntu-latest and macos-latest), and the whole TypeScript suite including tests/conformance on macOS.
#
#   verified on pull requests - the same message-layer tests on ubuntu-latest, as a fast merge gate.
#
#   NOT verified here - observation through UI Automation or AT-SPI. Those need a desktop session with a
#   window to look at, not a runner, so the live rows stay marked unverified in
#   tests/conformance/fixtures/adapters.json and docs/validation-three-platforms.md until a machine with a
#   desktop produces them. A green run here is not evidence for those rows, and this comment exists so nobody
#   reads it as if it were.
# A platform whose live row does not exist yet is listed here and in the fixture and the
# validation file; scripts/verify-ci-boundaries.mjs fails when the three disagree.
# unverified-platforms: none
name: collectors

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  protocol-pr:
    if: github.event_name == 'pull_request'
    name: protocol layer on ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The message layer, on Linux PR gate
        run: |
          cargo test --manifest-path native/collector-protocol/Cargo.toml
          cargo test --manifest-path native/windows/Cargo.toml
          cargo test --manifest-path native/linux/Cargo.toml

  protocol-full:
    if: github.event_name != 'pull_request'
    name: protocol layer on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: The message layer, on this platform
        run: |
          cargo test --manifest-path native/collector-protocol/Cargo.toml
          cargo test --manifest-path native/windows/Cargo.toml
          cargo test --manifest-path native/linux/Cargo.toml

  suite:
    if: github.event_name != 'pull_request'
    name: conformance and the rest of the gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm verify` includes tests/integration/packaged-entry.spec.ts, which imports the built
      # `lib/index.js` - so the gate needs a build first, on a checkout that has never built.
      - run: pnpm build
      - name: The gate, which includes tests/conformance
        run: pnpm verify
