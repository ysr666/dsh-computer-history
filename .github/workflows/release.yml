# Manual release: exact main -> native triple -> one tarball -> three installed UI checks -> npm -> GitHub.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact version tag (v1.0.0)
        type: string
        required: true
      target_sha:
        description: Exact current main SHA to release
        type: string
        required: true

permissions: {}

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Refuse stale or mismatched release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify SHA, version, announcements and immutable tag identity
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          test "$RELEASE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch --no-tags origin main:refs/remotes/origin/main
          MAIN_SHA="$(git rev-parse origin/main)"
          VERSION="$(node -p "require('./package.json').version")"
          test "$VERSION" = '1.0.0'
          test "$RELEASE_TAG" = "v$VERSION"
          test "$(node -p "require('./package.json').private === true")" = 'false'
          test -s "docs/releases/$RELEASE_TAG.md"
          for file in README.md README.zh.md; do
            grep -q "$RELEASE_TAG" "$file" || { echo "::error::$file has no release announcement"; exit 1; }
          done
          EXISTING_TAG_SHA="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | cut -f1)"
          if [ -n "$EXISTING_TAG_SHA" ]; then
            # A release can be retried after a partial npm/GitHub publication.
            # The existing immutable tag must still point at exactly the verified commit.
            test "$EXISTING_TAG_SHA" = "$RELEASE_SHA" || { echo "::error::existing $RELEASE_TAG points to a different SHA"; exit 1; }
            echo "::notice::recovering $RELEASE_TAG at the exact existing SHA"
          else
            test "$MAIN_SHA" = "$RELEASE_SHA" || { echo '::error::main moved before first tag'; exit 1; }
          fi
          echo "release preflight accepted $RELEASE_TAG ($RELEASE_SHA)"
      - name: Require first npm namespace reservation before creating any release tag
        run: node scripts/release-registry-identity.mjs inspect 0.0.0-bootstrap.0

  native:
    needs: preflight
    permissions:
      contents: read
    name: native artifact (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin
            binary: bin/dsh-computer-history-collector
          - os: windows-latest
            platform: win32
            binary: bin/dsh-computer-history-collector-windows.exe
          - os: ubuntu-latest
            platform: linux
            binary: bin/dsh-computer-history-collector-linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0
      - name: Build the native collector on its own platform
        run: node scripts/build-native.mjs
      - name: Record the runner source commit
        env:
          NATIVE_PLATFORM: ${{ matrix.platform }}
        run: node -e "const fs=require('node:fs'); fs.writeFileSync('bin/source-'+process.env.NATIVE_PLATFORM+'.txt', process.env.GITHUB_SHA+'\n')"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-native-${{ matrix.platform }}
          path: |
            ${{ matrix.binary }}
            bin/source-${{ matrix.platform }}.txt
          if-no-files-found: error
          retention-days: 3

  assemble:
    name: assemble + verify release tarball
    needs: native
    runs-on: macos-14
    # Covers setup, packaging and the full product journey. A wedged browser
    # must fail before a Git tag or npm publication, not consume a runner for hours.
    timeout-minutes: 20
    # release-blockers.mjs reads workflow runs, PRs/issues and Dependabot alerts.
    # The workflow's top-level permissions: {} otherwise strips these scopes.
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
      security-events: read
      vulnerability-alerts: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm verify
      - run: pnpm install --frozen-lockfile
        working-directory: extension-editor

      - name: Install DSH 0.2 product-journey CLI
        run: |
          root=/tmp/dsh-product-journey-cli
          rm -rf "$root"
          mkdir -p "$root"
          echo '{"private":true}' > "$root/package.json"
          pnpm --dir "$root" add --ignore-scripts @deepseek-ai/dsh@0.2.0-rc.2
          "$root/node_modules/.bin/dsh" --version
          echo "DSH_CLI=$root/node_modules/.bin/dsh" >> "$GITHUB_ENV"

      - name: Use macOS Chrome already verified by the packaged browser matrix
        shell: bash
        run: |
          set -euo pipefail
          # The three-platform packaged-client gate uses this installed browser
          # on macos-14 and passed on the exact release commit. Chrome-for-Testing
          # closed or hung CDP on the same runner, even when pinned to v154.
          chrome='/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
          test -x "$chrome" || { echo '::error::verified macOS Chrome missing'; exit 1; }
          if [ "$(uname -m)" = arm64 ] && ! file "$chrome" | grep -q arm64; then
            echo '::error::Chrome has no native arm64 slice'; exit 1
          fi
          "$chrome" --version
          echo "PANEL_CHROME=$chrome" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-native-darwin
          path: bin
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-native-win32
          path: bin
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-native-linux
          path: bin
      - name: Prove all native jobs came from this release commit
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          for (const platform of ['darwin', 'win32', 'linux']) {
            const file = 'bin/source-' + platform + '.txt'
            const actual = fs.readFileSync(file, 'utf8').trim()
            if (actual !== process.env.GITHUB_SHA) {
              throw new Error(platform + ' artifact came from ' + actual + ', expected ' + process.env.GITHUB_SHA)
            }
            fs.rmSync(file)
          }
          fs.chmodSync('bin/dsh-computer-history-collector', 0o755)
          fs.chmodSync('bin/dsh-computer-history-collector-linux', 0o755)
          NODE
      - name: Record native hashes and provenance
        run: pnpm native:manifest
      - name: Pack without rebuilding native artifacts
        env:
          DSH_NATIVE_PREBUILT: '1'
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          pnpm pack --pack-destination "$RUNNER_TEMP/package"

      - name: Run installed product journey against the assembled release tarball
        run: |
          tarball=$(ls "$RUNNER_TEMP"/package/dsh-computer-history-*.tgz | head -1)
          test -n "$tarball"
          DSH_PRODUCT_TARBALL="$tarball" pnpm e2e:product-journey

      - name: Scan for release blockers
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm verify:release:blockers

      - name: Verify the release
        run: |
          tarball=$(ls "$RUNNER_TEMP"/package/dsh-computer-history-*.tgz | head -1)
          echo "verifying $tarball"
          DSH_RELEASE_TARBALL="$tarball" pnpm verify:release

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-plugin
          path: ${{ runner.temp }}/package/dsh-computer-history-*.tgz
          if-no-files-found: error
          retention-days: 3

  install:
    name: release clean install (${{ matrix.os }})
    needs: assemble
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-plugin
          path: ${{ runner.temp }}/package
      - name: Install the supported DSH CLI in an isolated tool directory
        run: npm install --prefix "${{ runner.temp }}/dsh-cli" @deepseek-ai/dsh@0.2.0-rc.2
      - name: Put the isolated DSH CLI on PATH
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_PATH, require('node:path').join(process.env.RUNNER_TEMP,'dsh-cli','node_modules','.bin')+'\n')"
      - name: Locate the exact release tarball
        run: node -e "const fs=require('node:fs'),p=require('node:path'); const d=p.join(process.env.RUNNER_TEMP,'package'); const f=fs.readdirSync(d).find(x=>x.endsWith('.tgz')); if(!f) throw new Error('tarball missing'); fs.appendFileSync(process.env.GITHUB_ENV,'DSH_E2E_TARBALL='+p.join(d,f)+'\n')"
      - name: Verify packaged hashes on this platform
        run: node scripts/verify-native-package.mjs
      - name: Strict packaged product path on this OS, no executable override or checkout wiring
        env:
          DSH_E2E_VERIFY_CLIENT: '1'
          DSH_E2E_TRANSPORT_TIMEOUT_MS: '480000'
        run: pnpm e2e:collector-transport
      - name: Upload release candidate browser evidence (no session credentials)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-product-${{ matrix.os }}
          path: |
            .debug/e2e-macos/**/checks.json
            .debug/e2e-macos/**/packaged-client/evidence.json
            .debug/e2e-macos/**/packaged-client/first-run.png
            .debug/e2e-macos/**/packaged-client/settings.png
            .debug/e2e-macos/**/packaged-client/first-run.txt
            .debug/e2e-macos/**/packaged-client/settings.txt
          if-no-files-found: error
          retention-days: 7

  tag:
    name: Materialize verified tag
    needs: install
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create or verify immutable SHA tag after packaged tests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          # matching-refs returns [] (HTTP 200) for a missing tag. Unlike the
          # exact ref endpoint, it cannot confuse gh's stdout 404 JSON with a
          # real SHA. Any API failure remains fatal under set -e.
          EXISTING_TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG" --jq ".[] | select(.ref == \"refs/tags/$RELEASE_TAG\") | .object.sha")"
          if [ -n "$EXISTING_TAG_SHA" ]; then
            test "$EXISTING_TAG_SHA" = "$RELEASE_SHA" || { echo '::error::immutable tag points elsewhere'; exit 1; }
            echo "::notice::$RELEASE_TAG already points at the verified SHA; keeping it"
          else
            MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
            test "$MAIN_SHA" = "$RELEASE_SHA" || { echo '::error::main moved before first tag creation'; exit 1; }
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" -f sha="$RELEASE_SHA"
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$RELEASE_SHA"

  publish-npm:
    name: Publish exact three-platform npm tarball with OIDC
    needs: tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'
          package-manager-cache: false
      - name: Install SHA-pinned npm client supporting Trusted Publishing
        shell: bash
        run: |
          set -euo pipefail
          NPM_VERSION=11.18.0
          NPM_SHA256=73f6155215ebabf4ed96dca1f567c2372cc713c33af2e5b9b62fde4e92373e2e
          curl --fail --silent --show-error --location \
            "https://registry.npmjs.org/npm/-/npm-$NPM_VERSION.tgz" --output "$RUNNER_TEMP/npm.tgz"
          printf '%s  %s\n' "$NPM_SHA256" "$RUNNER_TEMP/npm.tgz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/npm-cli" "$RUNNER_TEMP/npm-bin"
          tar -xzf "$RUNNER_TEMP/npm.tgz" -C "$RUNNER_TEMP/npm-cli" --strip-components=1
          ln -s "$RUNNER_TEMP/npm-cli/bin/npm-cli.js" "$RUNNER_TEMP/npm-bin/npm"
          echo "$RUNNER_TEMP/npm-bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-plugin
          path: ${{ runner.temp }}/package
      - name: Require exact candidate artifact and matching tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$VERSION"
          test "$GITHUB_SHA" = "$RELEASE_SHA"
          TARBALL="$RUNNER_TEMP/package/dsh-computer-history-$VERSION.tgz"
          test -s "$TARBALL"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git ls-remote origin "refs/tags/$RELEASE_TAG" | cut -f1)" = "$RELEASE_SHA"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PACKAGE_TARBALL=$TARBALL" >> "$GITHUB_ENV"
          echo "PACKAGE_SHA1=$(sha1sum "$TARBALL" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "PACKAGE_SHA256=$(sha256sum "$TARBALL" | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Refuse mismatched existing npm releases
        id: registry
        run: node scripts/release-registry-identity.mjs probe "$RELEASE_VERSION" "$PACKAGE_SHA1"
      - name: Publish exactly the verified tarball (no lifecycle rebuild)
        if: steps.registry.outputs.already_published == 'false'
        shell: bash
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: 'true'
        run: npm publish "$PACKAGE_TARBALL" --registry=https://registry.npmjs.org/ --access public --provenance --ignore-scripts
      - name: Wait for npm registry and verify exact package identity
        run: node scripts/release-registry-identity.mjs wait "$RELEASE_VERSION" "$PACKAGE_SHA1"
      - name: Save identity for final GitHub release job
        shell: bash
        run: |
          echo "$PACKAGE_SHA256  $(basename "$PACKAGE_TARBALL")" > "$RUNNER_TEMP/npm-release-sha256.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release-hash
          path: ${{ runner.temp }}/npm-release-sha256.txt
          if-no-files-found: error

  publish:
    name: Publish verified GitHub Release
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-plugin
          path: ${{ runner.temp }}/package
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release-hash
          path: ${{ runner.temp }}/hash
      - name: Verify npm identity, attach checked artifact, then publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TARBALL="dsh-computer-history-$VERSION.tgz"
          test "$RELEASE_TAG" = "v$VERSION"
          cd "$RUNNER_TEMP/package"
          test -s "$TARBALL"
          EXPECTED_SHA256="$(cut -d' ' -f1 "$RUNNER_TEMP/hash/npm-release-sha256.txt")"
          test "$(sha256sum "$TARBALL" | cut -d' ' -f1)" = "$EXPECTED_SHA256"
          LOCAL_SHA1="$(sha1sum "$TARBALL" | cut -d' ' -f1)"
          curl --fail --silent --show-error --location \
            "https://registry.npmjs.org/dsh-computer-history/-/$TARBALL" \
            --output "$RUNNER_TEMP/npm-registry.tgz"
          test "$(sha1sum "$RUNNER_TEMP/npm-registry.tgz" | cut -d' ' -f1)" = "$LOCAL_SHA1"
          test "$(sha256sum "$RUNNER_TEMP/npm-registry.tgz" | cut -d' ' -f1)" = "$(sha256sum "$TARBALL" | cut -d' ' -f1)"
          cp "$TARBALL" "$RUNNER_TEMP/$TARBALL"
          cd "$GITHUB_WORKSPACE"
          cp "docs/releases/$RELEASE_TAG.md" "$RUNNER_TEMP/release-notes.md"
          # A previous run may have created a draft and then failed before attaching
          # or publishing. Reuse only the same tag, and never overwrite a release asset.
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$GITHUB_SHA"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::notice::checking existing GitHub Release for $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          IS_DRAFT="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"
          if ! gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq "$TARBALL"; then
            test "$IS_DRAFT" = "true" || { echo '::error::published GitHub Release is missing its immutable tarball'; exit 1; }
            gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/$TARBALL"
          fi
          mkdir -p "$RUNNER_TEMP/release-check"
          gh release download "$RELEASE_TAG" --pattern "$TARBALL" --dir "$RUNNER_TEMP/release-check"
          test "$(sha256sum "$RUNNER_TEMP/release-check/$TARBALL" | cut -d' ' -f1)" = "$(sha256sum "$RUNNER_TEMP/$TARBALL" | cut -d' ' -f1)" || { echo '::error::existing GitHub release asset differs'; exit 1; }
          if [ "$IS_DRAFT" = "true" ]; then
            gh release edit "$RELEASE_TAG" --draft=false --latest
          else
            echo "::notice::identical published GitHub Release already exists"
          fi
          echo "Verified immutable $RELEASE_TAG with npm/GitHub byte-identical tarball"
