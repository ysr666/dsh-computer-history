# Publishing a release: push a `v*` tag whose name is `v` + the version in package.json.
#
# No certificate and no secrets. This is a DSH plugin: the artifact is a tarball that `dsh plugin add` fetches
# with Node, and Node sets no quarantine flag. Measured 2026-10-05 on an arm64 Mac with the collector this
# repository ships:
#
#   * an unsigned arm64 binary is killed by the kernel ("Killed: 9") - so a signature is required;
#   * an ad-hoc signature is enough, and that is what `scripts/build-native.mjs` has always produced;
#   * a copy carrying a Safari quarantine flag still ran normally;
#   * `spctl -a` reports our ad-hoc binary as "rejected" and it runs anyway - that gate is for app bundles,
#     not for a CLI a plugin spawns.
#
# A Developer ID certificate only becomes necessary if this ever ships a `.app`/`.dmg`/`.pkg`, or asks a user to
# launch the binary from Finder. See the "Publishing" section of docs/release.md.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir extension-editor install --frozen-lockfile
      - run: pnpm build
      - run: pnpm verify

      - name: Install DSH 0.2 product-journey CLI
        run: |
          root=/tmp/dsh-product-journey-cli
          rm -rf "$root"
          mkdir -p "$root"
          printf '{"private":true}\n' > "$root/package.json"
          pnpm --dir "$root" add --ignore-scripts @deepseek-ai/dsh@0.2.0-rc.2
          "$root/node_modules/.bin/dsh" --version
          echo "DSH_CLI=$root/node_modules/.bin/dsh" >> "$GITHUB_ENV"

      - name: Install stable Chrome for Testing
        run: |
          python3 <<'PY'
          import json
          import subprocess
          import urllib.request
          import zipfile
          from pathlib import Path

          endpoint = (
              'https://googlechromelabs.github.io/chrome-for-testing/'
              'last-known-good-versions-with-downloads.json'
          )
          # `platform.machine()` reports the Python binary's architecture and
          # can say x86_64 when Python itself runs under Rosetta on Apple
          # Silicon. Chrome must match the native machine instead.
          native_machine = subprocess.check_output(
              ['uname', '-m'],
              text=True,
          ).strip()
          platform_name = (
              'mac-arm64'
              if native_machine == 'arm64'
              else 'mac-x64'
          )
          with urllib.request.urlopen(endpoint, timeout=30) as response:
              data = json.load(response)
          stable = data['channels']['Stable']
          match = next(
              item for item in stable['downloads']['chrome']
              if item['platform'] == platform_name
          )
          archive = Path('/tmp/chrome-for-testing.zip')
          destination = Path('/tmp/chrome-for-testing')
          if destination.exists():
              import shutil
              shutil.rmtree(destination)
          urllib.request.urlretrieve(match['url'], archive)
          destination.mkdir(parents=True)
          with zipfile.ZipFile(archive) as bundle:
              bundle.extractall(destination)
          print(
              f"Chrome for Testing {stable['version']} "
              f"({platform_name}) from {match['url']}"
          )
          PY
          chrome=$(find /tmp/chrome-for-testing -type f \
            -path '*/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing' \
            -print -quit)
          test -n "$chrome"
          chmod +x "$chrome"
          xattr -dr com.apple.quarantine /tmp/chrome-for-testing 2>/dev/null || true
          app=$(dirname "$(dirname "$(dirname "$chrome")")")
          version=$(plutil -extract CFBundleShortVersionString raw -o - "$app/Contents/Info.plist")
          echo "Chrome for Testing $version"
          echo "PANEL_CHROME=$chrome" >> "$GITHUB_ENV"

      - name: Run the installed product journey
        run: pnpm e2e:product-journey

      - run: pnpm native:build
      - run: pnpm install --frozen-lockfile
        working-directory: extension-editor
      - run: pnpm pack --pack-destination /tmp

      - name: Scan for release blockers
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm verify:release:blockers

      - name: Verify the release
        run: |
          tarball=$(ls /tmp/dsh-computer-history-*.tgz | head -1)
          echo "verifying $tarball"
          DSH_RELEASE_TARBALL="$tarball" pnpm verify:release

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The notes are the changelog section for this version, which the preflight has just proved exists.
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 == "## " v {found=1; next} /^## / {found=0} found' CHANGELOG.md > /tmp/notes.md
          test -s /tmp/notes.md || { echo "no changelog section for $version"; exit 1; }
          gh release create "$GITHUB_REF_NAME" /tmp/dsh-computer-history-*.tgz \
            --title "$GITHUB_REF_NAME" --notes-file /tmp/notes.md
