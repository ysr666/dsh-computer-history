# Experimental but strict live UIA acceptance on GitHub's hosted Windows VM.
#
# This is deliberately separate from the protocol matrix: that matrix proves the
# cross-platform message layer, while this job asks a different question - can a
# hosted Windows runner expose a real foreground Notepad window to the real
# Windows UI Automation collector?
name: windows hosted live probe

on:
  pull_request:
    paths:
      - 'native/windows/**'
      - 'native/collector-protocol/**'
      - 'scripts/e2e-windows-hosted.ps1'
      - 'scripts/e2e-macos.mjs'
      - 'extension-editor/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/windows-live-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-uia:
    name: Notepad -> UIA -> collector
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Runner identity
        shell: pwsh
        run: |
          Write-Host "ImageOS=$env:ImageOS"
          Write-Host "ImageVersion=$env:ImageVersion"
          Write-Host "RUNNER_ARCH=$env:RUNNER_ARCH"
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsBuildNumber
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0
          cache: pnpm
      - name: Install repository dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile
      - name: Install the Host CLI used by the app
        shell: pwsh
        run: npm install --prefix "$env:RUNNER_TEMP\dsh-cli" @deepseek-ai/dsh@0.2.0-rc.2
      - name: Build the real Windows collector
        shell: pwsh
        run: cargo build --release --manifest-path native/windows/Cargo.toml
      - name: Live hosted-runner UIA and full Host probe
        shell: pwsh
        run: ./scripts/e2e-windows-hosted.ps1 -FullHost
