[package]
name = "dsh-collector-protocol"
version = "0.1.0"
edition = "2021"
description = "The collector message layer shared by the Windows and Linux collectors: the shapes in docs/collector-protocol.md, once"
license = "MIT"
[dependencies]
# The wire format is JSON; serde produces it rather than a hand-written encoder, and the two defects this
# layer produced (an invalid line, a mangled control character) were both encoder bugs.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
